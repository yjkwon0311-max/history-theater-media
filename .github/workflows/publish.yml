name: 역사 실화극장 자동 발행

# GitHub 예약(schedule)은 최선노력이라 특정 시각만 잡으면 지연·누락으로 놓친다.
# 그래서 30분마다 돌린다. publish.py는 'at <= now 인데 아직 미발행'인 편만 발행하고
# 멱등(발행된 건 건너뜀)이라, 자주 돌려도 중복 없이 예약 시각 직후 첫 실행에 발행된다.
# → 07/12/18 슬롯 아이템은 그 시각 지난 첫 실행(최대 30분 안)에 나간다.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1이면 발행 안 하고 대상만 확인'
        required: false
        default: '0'

# 발행 기록(yt_sent/ig_sent)을 저장소에 되커밋하려면 쓰기 권한 필요
permissions:
  contents: write

# 동시 실행 방지 (겹쳐서 중복 발행되는 것 차단)
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 발행 실행
        id: pub
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python publish.py

      - name: 발행 기록 커밋
        if: steps.pub.outputs.changed == 'true'
        run: |
          git config user.name "history-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "발행 기록 갱신 + 발행완료 영상 정리 [skip ci]" || echo "변경 없음"
          git push
